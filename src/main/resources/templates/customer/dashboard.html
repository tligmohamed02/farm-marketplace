<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mes commandes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="/">🌾 Farm Marketplace</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/customer/products">Produits</a>
      <a class="nav-link" href="/customer/dashboard">Mes Commandes</a>
      <a class="nav-link" href="/auth/logout">Déconnexion</a>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h1 class="mb-4">Mes Commandes</h1>

  <div th:if="${orders.isEmpty()}" class="alert alert-info">
    Vous n'avez pas encore de commandes. <a href="/customer/products">Voir les produits</a>
  </div>

  <div class="table-responsive" th:if="${!orders.isEmpty()}">
    <table class="table table-striped">
      <thead>
      <tr>
        <th>N° Commande</th>
        <th>Date</th>
        <th>Montant total</th>
        <th>Statut</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="order : ${orders}">
        <td th:text="${order.orderId}">ID</td>
        <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}">Date</td>
        <td th:text="${order.totalAmount} + ' DT'">Total</td>
        <td>
                            <span class="badge"
                                  th:classappend="${order.status == 'DELIVERED' ? 'bg-success' :
                                                   order.status == 'CANCELLED' ? 'bg-danger' : 'bg-warning'}"
                                  th:text="${order.status}">
                                Statut
                            </span>
        </td>
        <td>
          <a th:href="@{/customer/orders/{id}(id=${order.orderId})}"
             class="btn btn-sm btn-primary">Voir détails</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>

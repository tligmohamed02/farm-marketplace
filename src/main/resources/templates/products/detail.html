<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Détails du produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/">🌾 Farm Marketplace</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/products">Produits</a>
            <a class="nav-link" href="/auth/login">Connexion</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <img th:src="${product.imageUrl ?: 'https://via.placeholder.com/500x400?text=Produit'}"
                 class="img-fluid rounded" alt="Product">
        </div>
        <div class="col-md-6">
            <h1 th:text="${product.name}">Nom du produit</h1>
            <p class="text-muted" th:text="${product.category}">Catégorie</p>
            <hr>
            <h3 class="text-success" th:text="${product.price} + ' DT'">Prix</h3>
            <p th:text="'Stock disponible: ' + ${product.stock}">Stock</p>
            <hr>
            <h5>Description</h5>
            <p th:text="${product.description}">Description du produit</p>
            <hr>
            <p><strong>Agriculteur:</strong> <span th:text="${product.farmer.name}">Nom</span></p>
            <p><strong>Ferme:</strong> <span th:text="${product.farmer.farmName}">Ferme</span></p>
            <p><strong>Localisation:</strong> <span th:text="${product.farmer.location}">Lieu</span></p>
            <hr>
            <button class="btn btn-success btn-lg">🛒 Ajouter au panier</button>
            <a href="/products" class="btn btn-outline-secondary btn-lg">← Retour</a>
        </div>
    </div>
</div>
</body>
</html>

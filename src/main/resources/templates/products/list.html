<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tous les produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="/">🌾 Farm Marketplace</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/products">Produits</a>
            <a class="nav-link position-relative" href="/customer/cart" th:if="${session.userId != null}">
                🛒 Panier
                <span th:if="${cartCount > 0}"
                      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                      th:text="${cartCount}">
                        0
                    </span>
            </a>
            <a class="nav-link" href="/auth/login" th:if="${session.userId == null}">Connexion</a>
            <a class="nav-link" href="/auth/register" th:if="${session.userId == null}">Inscription</a>
            <a class="nav-link" href="/customer/dashboard" th:if="${session.userId != null}">Mes Commandes</a>
            <a class="nav-link" href="/auth/logout" th:if="${session.userId != null}">Déconnexion</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Tous nos produits</h1>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${products.isEmpty()}" class="alert alert-info">
        Aucun produit disponible pour le moment.
    </div>

    <div class="row">
        <div class="col-md-4 mb-4" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">
                <img th:src="${product.imageUrl ?: 'https://via.placeholder.com/300x200?text=Produit'}"
                     class="card-img-top" alt="Product"
                     style="height: 200px; object-fit: cover;">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${product.name}">Produit</h5>
                    <p class="card-text text-muted" th:text="${#strings.abbreviate(product.description, 80)}">Description</p>
                    <span class="badge bg-secondary mb-2 w-50" th:text="${product.category}">Catégorie</span>
                    <p class="text-muted small mb-1">
                        Par: <strong th:text="${product.farmer.farmName}">Ferme</strong>
                    </p>
                    <div class="mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h4 class="text-success mb-0" th:text="${product.price} + ' DT'">Prix</h4>
                            <span class="text-muted" th:text="'Stock: ' + ${product.stock}">Stock</span>
                        </div>
                        <div class="d-flex gap-2">
                            <a th:href="@{/products/{id}(id=${product.productId})}"
                               class="btn btn-outline-success flex-grow-1">
                                👁️ Détails
                            </a>
                            <form method="post" th:action="@{/products/cart/add}" class="flex-grow-1">
                                <input type="hidden" name="productId" th:value="${product.productId}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-success w-100"
                                        th:disabled="${product.stock <= 0}">
                                    🛒 Ajouter
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

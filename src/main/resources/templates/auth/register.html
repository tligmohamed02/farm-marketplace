<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Inscription</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-body p-5">
          <h2 class="text-center mb-4">📝 Inscription</h2>

          <div th:if="${error}" class="alert alert-danger" th:text="${error}">Erreur</div>

          <form method="post" th:action="@{/auth/register}" id="registerForm">
            <div class="mb-3">
              <label class="form-label">Type de compte</label>
              <select name="userType" class="form-select" id="userType" required>
                <option value="customer">Client</option>
                <option value="farmer">Agriculteur</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Nom complet</label>
              <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Mot de passe</label>
              <input type="password" name="password" class="form-control" required>
            </div>

            <!-- Champs pour Agriculteur -->
            <div id="farmerFields" style="display: none;">
              <div class="mb-3">
                <label class="form-label">Nom de la ferme</label>
                <input type="text" name="farmName" class="form-control">
              </div>
              <div class="mb-3">
                <label class="form-label">Localisation</label>
                <input type="text" name="location" class="form-control">
              </div>
            </div>

            <!-- Champs pour Client -->
            <div id="customerFields">
              <div class="mb-3">
                <label class="form-label">Adresse de livraison</label>
                <input type="text" name="address" class="form-control">
              </div>
              <div class="mb-3">
                <label class="form-label">Téléphone</label>
                <input type="tel" name="phone" class="form-control">
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100">S'inscrire</button>
          </form>

          <div class="text-center mt-3">
            <a href="/auth/login">Déjà inscrit ? Se connecter</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('userType').addEventListener('change', function() {
    if (this.value === 'farmer') {
      document.getElementById('farmerFields').style.display = 'block';
      document.getElementById('customerFields').style.display = 'none';
    } else {
      document.getElementById('farmerFields').style.display = 'none';
      document.getElementById('customerFields').style.display = 'block';
    }
  });
</script>
</body>
</html>

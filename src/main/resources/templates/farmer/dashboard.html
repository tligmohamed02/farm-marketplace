<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tableau de bord - Agriculteur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="/">🌾 Farm Marketplace</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/farmer/dashboard">Mes Produits</a>
      <a class="nav-link" href="/auth/logout">Déconnexion</a>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Mes Produits</h1>
    <a href="/farmer/products/add" class="btn btn-success">➕ Ajouter un produit</a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
      <tr>
        <th>Image</th>
        <th>Nom</th>
        <th>Prix</th>
        <th>Stock</th>
        <th>Catégorie</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="product : ${products}">
        <td>
          <img th:src="${product.imageUrl}" alt="Product"
               style="width: 50px; height: 50px; object-fit: cover;">
        </td>
        <td th:text="${product.name}">Nom</td>
        <td th:text="${product.price} + ' DT'">Prix</td>
        <td th:text="${product.stock}">Stock</td>
        <td th:text="${product.category}">Catégorie</td>
        <td>
          <a th:href="@{/farmer/products/edit/{id}(id=${product.productId})}"
             class="btn btn-sm btn-warning">✏️ Modifier</a>
          <form th:action="@{/farmer/products/delete/{id}(id=${product.productId})}"
                method="post" style="display: inline;">
            <button type="submit" class="btn btn-sm btn-danger"
                    onclick="return confirm('Confirmer la suppression ?')">
              🗑️ Supprimer
            </button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>

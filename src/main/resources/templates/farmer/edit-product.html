<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Modifier un produit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="/">🌾 Farm Marketplace</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/farmer/dashboard">Mes Produits</a>
      <a class="nav-link" href="/auth/logout">Déconnexion</a>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <h2 class="mb-4">✏️ Modifier le produit</h2>

          <form method="post" th:action="@{/farmer/products/edit/{id}(id=${product.productId})}"
                th:object="${product}" enctype="multipart/form-data">

            <div class="mb-3">
              <label class="form-label">Nom du produit *</label>
              <input type="text" th:field="*{name}" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Description *</label>
              <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Prix (DT) *</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Stock *</label>
                <input type="number" th:field="*{stock}" class="form-control" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Catégorie *</label>
              <select th:field="*{category}" class="form-select" required>
                <option value="Fruits">Fruits</option>
                <option value="Légumes">Légumes</option>
                <option value="Céréales">Céréales</option>
                <option value="Produits laitiers">Produits laitiers</option>
                <option value="Viandes">Viandes</option>
                <option value="Œufs">Œufs</option>
                <option value="Miel">Miel</option>
                <option value="Autres">Autres</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Image actuelle</label>
              <div class="mb-2">
                <img th:src="${product.imageUrl}" alt="Image actuelle"
                     class="img-thumbnail" style="max-height: 150px;">
              </div>

              <label class="form-label">Changer l'image (optionnel)</label>
              <input type="file" name="image" class="form-control" accept="image/*" id="imageInput">
              <small class="text-muted">Laissez vide pour garder l'image actuelle</small>

              <!-- Preview nouvelle image -->
              <div id="imagePreview" class="mt-3" style="display: none;">
                <p class="text-muted">Nouvelle image :</p>
                <img id="previewImg" src="" alt="Preview"
                     class="img-thumbnail" style="max-height: 150px;">
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success">
                💾 Enregistrer
              </button>
              <a href="/farmer/dashboard" class="btn btn-secondary">
                ❌ Annuler
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      // Vérifier la taille (5MB max)
      if (file.size > 5 * 1024 * 1024) {
        alert('❌ Image trop grande ! Maximum 5MB');
        this.value = '';
        document.getElementById('imagePreview').style.display = 'none';
        return;
      }

      // Afficher le preview
      const reader = new FileReader();
      reader.onload = function(event) {
        document.getElementById('previewImg').src = event.target.result;
        document.getElementById('imagePreview').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  });
</script>
</body>
</html>

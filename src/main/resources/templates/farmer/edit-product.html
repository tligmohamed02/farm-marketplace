<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Modifier un produit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="/">🌾 Farm Marketplace</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/farmer/dashboard">Mes Produits</a>
      <a class="nav-link" href="/auth/logout">Déconnexion</a>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-body">
          <h2 class="mb-4">Modifier le produit</h2>

          <form method="post" th:action="@{/farmer/products/edit/{id}(id=${product.productId})}"
                th:object="${product}">
            <div class="mb-3">
              <label class="form-label">Nom du produit</label>
              <input type="text" th:field="*{name}" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Prix (DT)</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Stock</label>
                <input type="number" th:field="*{stock}" class="form-control" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Catégorie</label>
              <select th:field="*{category}" class="form-select" required>
                <option value="Fruits">Fruits</option>
                <option value="Légumes">Légumes</option>
                <option value="Céréales">Céréales</option>
                <option value="Produits laitiers">Produits laitiers</option>
                <option value="Viandes">Viandes</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">URL de l'image</label>
              <input type="url" th:field="*{imageUrl}" class="form-control">
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-success">Enregistrer</button>
              <a href="/farmer/dashboard" class="btn btn-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

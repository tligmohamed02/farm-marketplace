<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Farm Marketplace - Accueil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="/">🌾 Farm Marketplace</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/auth/login">Connexion</a>
      <a class="nav-link" href="/auth/register">Inscription</a>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h1 class="text-center mb-4">Produits Disponibles</h1>

  <div class="row">
    <div class="col-md-4 mb-4" th:each="product : ${products}">
      <div class="card h-100">
        <img th:src="${product.imageUrl}" class="card-img-top" alt="Product"
             style="height: 200px; object-fit: cover;">
        <div class="card-body">
          <h5 class="card-title" th:text="${product.name}">Produit</h5>
          <p class="card-text" th:text="${product.description}">Description</p>
          <p class="text-success fw-bold" th:text="${product.price} + ' DT'">Prix</p>
          <p class="text-muted" th:text="'Stock: ' + ${product.stock}">Stock</p>
          <a th:href="@{/products/{id}(id=${product.productId})}"
             class="btn btn-primary">Voir détails</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
